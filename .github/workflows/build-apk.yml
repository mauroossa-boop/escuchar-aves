name: Build Escuchar Aves APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Descomprimir proyecto
        run: unzip -q escuchar_aves_android.zip

      - name: Crear automatizacion Merlin v7
        run: |
          BASE="escuchar_aves_android/app/src/main"
          JAVA="$BASE/java/com/birdscolombia/escucharaves"

          cat > "$JAVA/MainActivity.java" <<'JAVA'
          package com.birdscolombia.escucharaves;

          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              private static final String MERLIN =
                      "com.labs.merlinbirdid.app";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  long trigger = System.currentTimeMillis();

                  getSharedPreferences("automation", MODE_PRIVATE)
                          .edit()
                          .putBoolean("pending", true)
                          .putLong("trigger", trigger)
                          .apply();

                  Intent merlin =
                          getPackageManager()
                                  .getLaunchIntentForPackage(MERLIN);

                  if (merlin != null) {

                      merlin.addFlags(
                              Intent.FLAG_ACTIVITY_NEW_TASK |
                              Intent.FLAG_ACTIVITY_CLEAR_TOP
                      );

                      startActivity(merlin);

                  } else {

                      Toast.makeText(
                              this,
                              "No encontré Merlin Bird ID.",
                              Toast.LENGTH_LONG
                      ).show();
                  }

                  finish();
              }
          }
          JAVA

          cat > "$JAVA/MerlinAccessibilityService.java" <<'JAVA'
          package com.birdscolombia.escucharaves;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.graphics.Path;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.DisplayMetrics;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;

          import java.util.Locale;

          public class MerlinAccessibilityService
                  extends AccessibilityService {

              private static final String MERLIN =
                      "com.labs.merlinbirdid.app";

              private final Handler handler =
                      new Handler(Looper.getMainLooper());

              private long lastHandledTrigger = 0;

              @Override
              public void onAccessibilityEvent(
                      AccessibilityEvent event) {

                  if (event == null ||
                          event.getPackageName() == null ||
                          !MERLIN.contentEquals(
                                  event.getPackageName())) {
                      return;
                  }

                  boolean pending =
                          getSharedPreferences(
                                  "automation",
                                  MODE_PRIVATE
                          ).getBoolean("pending", false);

                  long trigger =
                          getSharedPreferences(
                                  "automation",
                                  MODE_PRIVATE
                          ).getLong("trigger", 0);

                  if (!pending || trigger == 0) {
                      return;
                  }

                  if (System.currentTimeMillis() - trigger
                          > 20000) {
                      clearPending();
                      return;
                  }

                  if (trigger == lastHandledTrigger) {
                      return;
                  }

                  lastHandledTrigger = trigger;

                  handler.postDelayed(
                          this::openAudioId,
                          1200
                  );
              }

              private void openAudioId() {

                  if (isSoundIdScreen()) {

                      handler.postDelayed(
                              this::startRecording,
                              500
                      );

                      return;
                  }

                  boolean clicked =
                          clickByKeywords(
                                  "Audio ID",
                                  "Sound ID"
                          );

                  if (!clicked) {

                      tapRelative(
                              0.50f,
                              0.66f
                      );
                  }

                  handler.postDelayed(
                          this::startRecording,
                          2200
                  );
              }

              private void startRecording() {

                  if (!isSoundIdScreen()) {

                      handler.postDelayed(
                              this::startRecordingSecondTry,
                              1200
                      );

                      return;
                  }

                  boolean clicked =
                          clickByKeywords(
                                  "Iniciar grabación",
                                  "Start recording",
                                  "Grabar",
                                  "Record",
                                  "Micrófono",
                                  "Microphone"
                          );

                  if (!clicked) {

                      tapRelative(
                              0.50f,
                              0.715f
                      );
                  }

                  handler.postDelayed(
                          this::clearPending,
                          1200
                  );
              }

              private void startRecordingSecondTry() {

                  boolean audioClicked =
                          clickByKeywords(
                                  "Audio ID",
                                  "Sound ID"
                          );

                  if (!audioClicked) {

                      tapRelative(
                              0.50f,
                              0.66f
                      );
                  }

                  handler.postDelayed(
                          () -> {

                              boolean recordClicked =
                                      clickByKeywords(
                                              "Iniciar grabación",
                                              "Start recording",
                                              "Grabar",
                                              "Record",
                                              "Micrófono",
                                              "Microphone"
                                      );

                              if (!recordClicked) {

                                  tapRelative(
                                          0.50f,
                                          0.715f
                                  );
                              }

                              handler.postDelayed(
                                      this::clearPending,
                                      1200
                              );
                          },
                          2000
                  );
              }

              private boolean isSoundIdScreen() {

                  return screenContains(
                          "No hay sugerencias",
                          "No suggestions",
                          "¿Por qué Merlin no está identificando",
                          "Why isn't Merlin identifying"
                  );
              }

              private boolean clickByKeywords(
                      String... keywords) {

                  AccessibilityNodeInfo root =
                          getRootInActiveWindow();

                  if (root == null) {
                      return false;
                  }

                  for (String keyword : keywords) {

                      AccessibilityNodeInfo node =
                              findNode(root, keyword);

                      if (node != null &&
                              clickNodeOrParent(node)) {
                          return true;
                      }
                  }

                  return false;
              }

              private AccessibilityNodeInfo findNode(
                      AccessibilityNodeInfo node,
                      String keyword) {

                  if (node == null) {
                      return null;
                  }

                  String target =
                          keyword.toLowerCase(Locale.ROOT);

                  CharSequence text =
                          node.getText();

                  CharSequence description =
                          node.getContentDescription();

                  if (text != null &&
                          text.toString()
                                  .toLowerCase(Locale.ROOT)
                                  .contains(target)) {
                      return node;
                  }

                  if (description != null &&
                          description.toString()
                                  .toLowerCase(Locale.ROOT)
                                  .contains(target)) {
                      return node;
                  }

                  for (int i = 0;
                       i < node.getChildCount();
                       i++) {

                      AccessibilityNodeInfo found =
                              findNode(
                                      node.getChild(i),
                                      keyword
                              );

                      if (found != null) {
                          return found;
                      }
                  }

                  return null;
              }

              private boolean clickNodeOrParent(
                      AccessibilityNodeInfo node) {

                  AccessibilityNodeInfo current =
                          node;

                  for (int i = 0;
                       i < 8 && current != null;
                       i++) {

                      if (current.isClickable()) {

                          return current.performAction(
                                  AccessibilityNodeInfo.ACTION_CLICK
                          );
                      }

                      current = current.getParent();
                  }

                  return false;
              }

              private boolean screenContains(
                      String... keywords) {

                  AccessibilityNodeInfo root =
                          getRootInActiveWindow();

                  if (root == null) {
                      return false;
                  }

                  for (String keyword : keywords) {

                      if (findNode(root, keyword)
                              != null) {
                          return true;
                      }
                  }

                  return false;
              }

              private void tapRelative(
                      float xPercent,
                      float yPercent) {

                  DisplayMetrics metrics =
                          getResources()
                                  .getDisplayMetrics();

                  float x =
                          metrics.widthPixels *
                                  xPercent;

                  float y =
                          metrics.heightPixels *
                                  yPercent;

                  Path path = new Path();

                  path.moveTo(x, y);

                  GestureDescription gesture =
                          new GestureDescription.Builder()
                                  .addStroke(
                                          new GestureDescription
                                                  .StrokeDescription(
                                                  path,
                                                  0,
                                                  100
                                          )
                                  )
                                  .build();

                  dispatchGesture(
                          gesture,
                          null,
                          null
                  );
              }

              private void clearPending() {

                  getSharedPreferences(
                          "automation",
                          MODE_PRIVATE
                  ).edit()
                          .putBoolean(
                                  "pending",
                                  false
                          )
                          .apply();
              }

              @Override
              public void onInterrupt() {
              }
          }
          JAVA

          mkdir -p "$BASE/res/xml"

          cat > "$BASE/res/xml/merlin_accessibility_service.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged|typeWindowsChanged|typeViewClicked"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:packageNames="com.labs.merlinbirdid.app"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true"
              android:accessibilityFlags="flagReportViewIds|flagRetrieveInteractiveWindows"
              android:description="@string/app_name" />
          XML

          python3 <<'PY'
          from pathlib import Path

          manifest = Path(
              "escuchar_aves_android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          merlin_package = (
              '<package android:name="com.labs.merlinbirdid.app" />'
          )

          if "com.labs.merlinbirdid.app" not in text:

              if "<queries>" in text:

                  text = text.replace(
                      "</queries>",
                      f"    {merlin_package}\n    </queries>",
                      1
                  )

              else:

                  text = text.replace(
                      "<application",
                      "    <queries>\n"
                      f"        {merlin_package}\n"
                      "    </queries>\n\n"
                      "    <application",
                      1
                  )

          service = """
                  <service
                      android:name=".MerlinAccessibilityService"
                      android:label="Escuchar aves"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/merlin_accessibility_service" />

                  </service>
          """

          if "MerlinAccessibilityService" not in text:

              text = text.replace(
                  "</application>",
                  service +
                  "\n    </application>",
                  1
              )

          manifest.write_text(text)

          print(text)
          PY

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Construir APK
        working-directory: escuchar_aves_android
        run: gradle :app:assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: EscucharAves-APK-v7
          path: escuchar_aves_android/app/build/outputs/apk/debug/app-debug.apk
