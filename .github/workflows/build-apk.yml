name: Build Escuchar Aves APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Descomprimir proyecto
        run: unzip -q escuchar_aves_android.zip

      - name: Abrir directamente Merlin Audio ID
        run: |
          FILE=$(find escuchar_aves_android -name MainActivity.java | head -n 1)

          cat > "$FILE" <<'EOF'
          package com.birdscolombia.escucharaves;

          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.os.Bundle;

          public class MainActivity extends Activity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  try {
                      Intent intent = new Intent(Intent.ACTION_MAIN);

                      intent.setComponent(new ComponentName(
                              "com.labs.merlinbirdid.app",
                              "edu.cornell.birds.merlin.soundid.deeplink.SoundIdDeepLinksActivity"
                      ));

                      startActivity(intent);

                  } catch (ActivityNotFoundException e) {

                      Intent fallback =
                              getPackageManager().getLaunchIntentForPackage(
                                      "com.labs.merlinbirdid.app"
                              );

                      if (fallback != null) {
                          startActivity(fallback);
                      }
                  }

                  finish();
              }
          }
          EOF

          echo "MainActivity reemplazada:"
          grep -n "SoundIdDeepLinksActivity" "$FILE"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Construir APK
        working-directory: escuchar_aves_android
        run: gradle :app:assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: EscucharAves-APK-v5
          path: escuchar_aves_android/app/build/outputs/apk/debug/app-debug.apk
