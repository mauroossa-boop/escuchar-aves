name: Build Escuchar Aves APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Descomprimir proyecto
        run: unzip -q escuchar_aves_android.zip

      - name: Crear automatizacion Merlin v8
        run: |
          BASE="escuchar_aves_android/app/src/main"
          JAVA="$BASE/java/com/birdscolombia/escucharaves"

          cat > "$JAVA/MainActivity.java" <<'JAVA'
          package com.birdscolombia.escucharaves;

          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              public static final String ACTION_START =
                      "com.birdscolombia.escucharaves.START_MERLIN_AUTOMATION";

              private static final String MERLIN =
                      "com.labs.merlinbirdid.app";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  long trigger = System.currentTimeMillis();

                  getSharedPreferences("automation", MODE_PRIVATE)
                          .edit()
                          .putBoolean("pending", true)
                          .putLong("trigger", trigger)
                          .apply();

                  // Avisar directamente al servicio de accesibilidad.
                  Intent automation = new Intent(ACTION_START);
                  automation.setPackage(getPackageName());
                  sendBroadcast(automation);

                  // Abrir Merlin.
                  Intent merlin =
                          getPackageManager()
                                  .getLaunchIntentForPackage(MERLIN);

                  if (merlin != null) {

                      merlin.addFlags(
                              Intent.FLAG_ACTIVITY_NEW_TASK |
                              Intent.FLAG_ACTIVITY_CLEAR_TOP |
                              Intent.FLAG_ACTIVITY_SINGLE_TOP
                      );

                      startActivity(merlin);

                  } else {

                      Toast.makeText(
                              this,
                              "No encontré Merlin Bird ID.",
                              Toast.LENGTH_LONG
                      ).show();
                  }

                  // Quitar Escuchar aves de aplicaciones recientes.
                  finishAndRemoveTask();
              }
          }
          JAVA

          cat > "$JAVA/MerlinAccessibilityService.java" <<'JAVA'
          package com.birdscolombia.escucharaves;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.graphics.Path;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.DisplayMetrics;
          import android.view.WindowManager;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;

          import java.util.Locale;

          public class MerlinAccessibilityService
                  extends AccessibilityService {

              private static final String MERLIN =
                      "com.labs.merlinbirdid.app";

              private static final String ACTION_START =
                      "com.birdscolombia.escucharaves.START_MERLIN_AUTOMATION";

              private final Handler handler =
                      new Handler(Looper.getMainLooper());

              private boolean automationRunning = false;
              private boolean receiverRegistered = false;

              private final BroadcastReceiver triggerReceiver =
                      new BroadcastReceiver() {

                          @Override
                          public void onReceive(
                                  Context context,
                                  Intent intent) {

                              if (intent != null &&
                                      ACTION_START.equals(
                                              intent.getAction())) {

                                  beginAutomation();
                              }
                          }
                      };

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();

                  IntentFilter filter =
                          new IntentFilter(ACTION_START);

                  if (Build.VERSION.SDK_INT >= 33) {

                      registerReceiver(
                              triggerReceiver,
                              filter,
                              Context.RECEIVER_NOT_EXPORTED
                      );

                  } else {

                      registerReceiver(
                              triggerReceiver,
                              filter
                      );
                  }

                  receiverRegistered = true;

                  // Si la orden llegó justo mientras Android
                  // estaba reiniciando el servicio, recuperarla.
                  boolean pending =
                          getSharedPreferences(
                                  "automation",
                                  MODE_PRIVATE
                          ).getBoolean("pending", false);

                  long trigger =
                          getSharedPreferences(
                                  "automation",
                                  MODE_PRIVATE
                          ).getLong("trigger", 0);

                  if (pending &&
                          trigger > 0 &&
                          System.currentTimeMillis() - trigger
                                  < 15000) {

                      beginAutomation();
                  }
              }

              private void beginAutomation() {

                  if (automationRunning) {
                      return;
                  }

                  automationRunning = true;

                  // Merlin necesita un instante para quedar visible.
                  handler.postDelayed(
                          this::openAudioId,
                          1200
                  );
              }

              private void openAudioId() {

                  // Si Merlin ya estaba en Audio ID,
                  // no tocamos nuevamente el botón de inicio.
                  if (isSoundIdScreen()) {

                      handler.postDelayed(
                              this::startRecording,
                              350
                      );

                      return;
                  }

                  boolean clicked =
                          clickByKeywords(
                                  "Audio ID",
                                  "Sound ID"
                          );

                  // Respaldo específico para el teléfono:
                  // botón central verde Audio ID.
                  if (!clicked) {

                      tapRelative(
                              0.50f,
                              0.665f
                      );
                  }

                  // Esperar la transición.
                  handler.postDelayed(
                          this::checkAudioIdFirstTime,
                          1700
                  );
              }

              private void checkAudioIdFirstTime() {

                  if (isSoundIdScreen()) {

                      startRecording();
                      return;
                  }

                  // Segundo intento para entrar a Audio ID.
                  boolean clicked =
                          clickByKeywords(
                                  "Audio ID",
                                  "Sound ID"
                          );

                  if (!clicked) {

                      tapRelative(
                              0.50f,
                              0.665f
                      );
                  }

                  handler.postDelayed(
                          this::checkAudioIdSecondTime,
                          1700
                  );
              }

              private void checkAudioIdSecondTime() {

                  if (isSoundIdScreen()) {

                      startRecording();
                      return;
                  }

                  /*
                   * Último respaldo:
                   * si Merlin no expone correctamente sus controles
                   * a Accesibilidad, asumimos que el segundo toque ya
                   * abrió Audio ID y tocamos físicamente la posición
                   * del micrófono.
                   */
                  tapRecordButton();

                  finishAutomation();
              }

              private void startRecording() {

                  boolean clicked =
                          clickByKeywords(
                                  "Iniciar grabación",
                                  "Start recording",
                                  "Grabar",
                                  "Record",
                                  "Micrófono",
                                  "Microphone"
                          );

                  if (!clicked) {

                      tapRecordButton();
                  }

                  finishAutomation();
              }

              private void tapRecordButton() {

                  // Posición del botón verde del micrófono
                  // en la pantalla de Audio ID.
                  tapRelative(
                          0.50f,
                          0.715f
                  );
              }

              private boolean isSoundIdScreen() {

                  return screenContains(
                          "No hay sugerencias",
                          "No suggestions",
                          "¿Por qué Merlin no está identificando",
                          "Why isn't Merlin identifying"
                  );
              }

              private boolean clickByKeywords(
                      String... keywords) {

                  AccessibilityNodeInfo root =
                          getRootInActiveWindow();

                  if (root == null) {
                      return false;
                  }

                  for (String keyword : keywords) {

                      AccessibilityNodeInfo node =
                              findNode(
                                      root,
                                      keyword
                              );

                      if (node != null &&
                              clickNodeOrParent(node)) {

                          return true;
                      }
                  }

                  return false;
              }

              private AccessibilityNodeInfo findNode(
                      AccessibilityNodeInfo node,
                      String keyword) {

                  if (node == null) {
                      return null;
                  }

                  String target =
                          keyword.toLowerCase(
                                  Locale.ROOT
                          );

                  CharSequence text =
                          node.getText();

                  CharSequence description =
                          node.getContentDescription();

                  if (text != null &&
                          text.toString()
                                  .toLowerCase(Locale.ROOT)
                                  .contains(target)) {

                      return node;
                  }

                  if (description != null &&
                          description.toString()
                                  .toLowerCase(Locale.ROOT)
                                  .contains(target)) {

                      return node;
                  }

                  for (int i = 0;
                       i < node.getChildCount();
                       i++) {

                      AccessibilityNodeInfo found =
                              findNode(
                                      node.getChild(i),
                                      keyword
                              );

                      if (found != null) {
                          return found;
                      }
                  }

                  return null;
              }

              private boolean clickNodeOrParent(
                      AccessibilityNodeInfo node) {

                  AccessibilityNodeInfo current =
                          node;

                  for (int i = 0;
                       i < 10 &&
                       current != null;
                       i++) {

                      if (current.isClickable()) {

                          return current.performAction(
                                  AccessibilityNodeInfo.ACTION_CLICK
                          );
                      }

                      current =
                              current.getParent();
                  }

                  return false;
              }

              private boolean screenContains(
                      String... keywords) {

                  AccessibilityNodeInfo root =
                          getRootInActiveWindow();

                  if (root == null) {
                      return false;
                  }

                  for (String keyword : keywords) {

                      if (findNode(
                              root,
                              keyword
                      ) != null) {

                          return true;
                      }
                  }

                  return false;
              }

              private void tapRelative(
                      float xPercent,
                      float yPercent) {

                  DisplayMetrics metrics =
                          new DisplayMetrics();

                  WindowManager windowManager =
                          (WindowManager)
                                  getSystemService(
                                          WINDOW_SERVICE
                                  );

                  windowManager
                          .getDefaultDisplay()
                          .getRealMetrics(metrics);

                  float x =
                          metrics.widthPixels *
                                  xPercent;

                  float y =
                          metrics.heightPixels *
                                  yPercent;

                  Path path =
                          new Path();

                  path.moveTo(x, y);

                  GestureDescription gesture =
                          new GestureDescription.Builder()
                                  .addStroke(
                                          new GestureDescription
                                                  .StrokeDescription(
                                                  path,
                                                  0,
                                                  120
                                          )
                                  )
                                  .build();

                  dispatchGesture(
                          gesture,
                          null,
                          null
                  );
              }

              private void finishAutomation() {

                  handler.postDelayed(
                          () -> {

                              getSharedPreferences(
                                      "automation",
                                      MODE_PRIVATE
                              ).edit()
                                      .putBoolean(
                                              "pending",
                                              false
                                      )
                                      .apply();

                              automationRunning =
                                      false;

                          },
                          800
                  );
              }

              @Override
              public void onAccessibilityEvent(
                      AccessibilityEvent event) {

                  /*
                   * Respaldo adicional:
                   * si por cualquier razón Android no entregó
                   * el broadcast, el primer evento de Merlin
                   * inicia la automatización.
                   */

                  if (event == null ||
                          event.getPackageName() == null ||
                          !MERLIN.contentEquals(
                                  event.getPackageName())) {

                      return;
                  }

                  boolean pending =
                          getSharedPreferences(
                                  "automation",
                                  MODE_PRIVATE
                          ).getBoolean(
                                  "pending",
                                  false
                          );

                  if (pending &&
                          !automationRunning) {

                      beginAutomation();
                  }
              }

              @Override
              public void onInterrupt() {
              }

              @Override
              public void onDestroy() {

                  if (receiverRegistered) {

                      try {
                          unregisterReceiver(
                                  triggerReceiver
                          );
                      } catch (Exception ignored) {
                      }
                  }

                  super.onDestroy();
              }
          }
          JAVA

          mkdir -p "$BASE/res/xml"

          cat > "$BASE/res/xml/merlin_accessibility_service.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged|typeWindowsChanged|typeViewClicked"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:packageNames="com.labs.merlinbirdid.app"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true"
              android:accessibilityFlags="flagReportViewIds|flagRetrieveInteractiveWindows"
              android:description="@string/app_name" />
          XML

          python3 <<'PY'
          from pathlib import Path
          import re

          manifest = Path(
              "escuchar_aves_android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          merlin_package = (
              '<package android:name="com.labs.merlinbirdid.app" />'
          )

          if "com.labs.merlinbirdid.app" not in text:

              if "<queries>" in text:

                  text = text.replace(
                      "</queries>",
                      f"    {merlin_package}\n    </queries>",
                      1
                  )

              else:

                  text = text.replace(
                      "<application",
                      "    <queries>\n"
                      f"        {merlin_package}\n"
                      "    </queries>\n\n"
                      "    <application",
                      1
                  )

          service = """
                  <service
                      android:name=".MerlinAccessibilityService"
                      android:label="Escuchar aves"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/merlin_accessibility_service" />

                  </service>
          """

          if "MerlinAccessibilityService" not in text:

              text = text.replace(
                  "</application>",
                  service +
                  "\n    </application>",
                  1
              )

          # Evitar que la Activity vacía quede en recientes.
          match = re.search(
              r'<activity\b[^>]*android:name="\.MainActivity"[^>]*>',
              text,
              flags=re.DOTALL
          )

          if match:

              activity = match.group(0)

              if 'android:noHistory=' not in activity:
                  activity = activity[:-1] + \
                      ' android:noHistory="true">'

              if 'android:excludeFromRecents=' not in activity:
                  activity = activity[:-1] + \
                      ' android:excludeFromRecents="true">'

              text = (
                  text[:match.start()] +
                  activity +
                  text[match.end():]
              )

          manifest.write_text(text)

          print(text)
          PY

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Construir APK
        working-directory: escuchar_aves_android
        run: gradle :app:assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: EscucharAves-APK-v8
          path: escuchar_aves_android/app/build/outputs/apk/debug/app-debug.apk
